[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-agent"
version = "1.0.0"
description = "A-share close-of-day research agent (Python backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Stock Agent Team" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.3",
    "boto3==1.35.36",
    "redis==5.1.1",
    "celery==5.4.0",
    "apscheduler==3.10.4",
    "typer==0.12.5",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "orjson==3.10.7",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "prometheus-client==0.21.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "slowapi==0.1.9",
    "akshare>=1.16.72",
    "pandas==2.2.3",
    "numpy==2.1.2",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-boto3==1.35.36.0",
    "moto[s3]==5.0.16",
    "fakeredis==2.24.1",
]

[project.scripts]
stock-agent = "stock_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N815"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["stock_agent"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["akshare.*", "celery.*", "apscheduler.*", "jose.*", "boto3.*", "botocore.*", "mypy_boto3_s3.*", "slowapi.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring Postgres/MinIO/Redis",
    "slow: long-running tests",
]

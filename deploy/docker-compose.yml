# Local production-shaped stack.
# Services:
#   - postgres  : durable DB
#   - redis     : celery broker + result backend + cache
#   - minio     : S3-compatible object storage
#   - migrator  : one-shot alembic upgrade
#   - api       : FastAPI (uvicorn, 2 workers)
#   - worker    : celery worker
#   - scheduler : APScheduler trigger
#   - web       : Next.js front-end proxied against api

x-backend-image: &backend-image
  build:
    context: ../backend
    dockerfile: Dockerfile
  image: stock-agent-backend:local
  env_file:
    - ../backend/.env.example
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_agent
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/stock-agent-data
      "

  migrator:
    <<: *backend-image
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend-image
    ports: ["8989:8989"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *backend-image
    command:
      [
        "celery",
        "-A",
        "stock_agent.workers.celery_app",
        "worker",
        "-Q",
        "agent,data,report,default",
        "-l",
        "info",
      ]
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-image
    command: ["python", "-m", "stock_agent.scheduler.main"]
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: stock-agent-web:local
    environment:
      # Browser (client-side) — hits Next rewrite → talks to api via localhost
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8989
      # Server-side (SSR / server components) — uses the docker network hostname
      API_BASE_URL: http://api:8989/api
    ports: ["3000:3000"]
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
